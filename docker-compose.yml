version: '3.8'

services:
  rag-bot:
    build: .
    container_name: rag-bot
    ports:
      - "8001:8001"
    volumes:
      - ./faiss_index:/app/faiss_index
      - ./knowledge_base:/app/knowledge_base
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
